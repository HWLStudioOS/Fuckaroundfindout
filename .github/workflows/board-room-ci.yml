name: Board Room CI

on:
  push:
    paths:
      - ".github/workflows/board-room-ci.yml"
      - "board-room/**"
      - "this-week.md"
      - "today.md"
  pull_request:
    paths:
      - ".github/workflows/board-room-ci.yml"
      - "board-room/**"
      - "this-week.md"
      - "today.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-room-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: board-room
    steps:
      - name: Check out Board Room sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /board-room/
            /this-week.md
            /today.md

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: board-room/package.json
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: board-room/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=low

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: |
          node scripts/generate-board-data.mjs
          node --test tests/*.test.mjs

      - name: Build
        run: pnpm run build
