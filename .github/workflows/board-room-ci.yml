name: Board Room CI

on:
  push:
    paths:
      - ".github/workflows/board-room-ci.yml"
      - "board-room/**"
      - "this-week.md"
      - "today.md"
  pull_request:
    paths:
      - ".github/workflows/board-room-ci.yml"
      - "board-room/**"
      - "this-week.md"
      - "today.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-room-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: board-room
    steps:
      - name: Check out Board Room sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /board-room/
            /this-week.md
            /today.md

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: board-room/package.json
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: board-room/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: |
          node scripts/generate-board-data.mjs
          node --test tests/*.test.mjs

      - name: Build
        run: pnpm run build
