version: 2
updates:
  - package-ecosystem: npm
    directory: /board-room
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /business/clients/baw/betteratwork-summer
    schedule:
      interval: weekly
      day: monday
      time: "06:10"
      timezone: Europe/London
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Europe/London
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
